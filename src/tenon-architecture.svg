<svg viewBox="0 0 680 460" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Tenon 框架分层架构</title>
<desc>core、ui、shell、pages 四层单向依赖，中间是 kit 换肤层，右侧是换肤三条路。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">Tenon · 榫 —— 分层与换肤</text>
<text x="40" y="54" font-family="sans-serif" font-size="12" fill="#5F5E5A">框架只读属性，CSS 只读类名，两边不越界</text>

<g>
<rect x="40" y="76" width="150" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="115" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">core 内核</text>
<text x="115" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">元素 · 事件 · 注册</text>
</g>

<g>
<rect x="40" y="176" width="150" height="64" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="115" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#27500A">ui 控件</text>
<text x="115" y="220" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3B6D11">只说逻辑状态</text>
</g>

<g>
<rect x="40" y="276" width="150" height="64" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="115" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806">shell 外壳</text>
<text x="115" y="320" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">页签 · 菜单 · 主题</text>
</g>

<g>
<rect x="40" y="376" width="150" height="64" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="115" y="400" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#72243E">pages 页面</text>
<text x="115" y="420" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993556">HTML 片段 · 业务</text>
</g>

<line x1="115" y1="140" x2="115" y2="176" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="115" y1="240" x2="115" y2="276" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="115" y1="340" x2="115" y2="376" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="124" y="164" font-family="sans-serif" font-size="12" fill="#5F5E5A">依赖</text>

<rect x="260" y="76" width="220" height="364" rx="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="370" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">kit 套件层 · 换肤点</text>

<g>
<rect x="286" y="122" width="168" height="54" rx="10" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="370" y="142" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">状态 → 类名</text>
<text x="370" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#888780">on · active · hidden</text>
</g>

<g>
<rect x="286" y="196" width="168" height="54" rx="10" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="370" y="216" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">部件 → 选择器</text>
<text x="370" y="234" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#888780">.tree-row · .tab</text>
</g>

<g>
<rect x="286" y="270" width="168" height="54" rx="10" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="370" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">标记 → 骨架</text>
<text x="370" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#888780">tpl · node</text>
</g>

<g>
<rect x="286" y="344" width="168" height="54" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="370" y="364" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">plain 兜底</text>
<text x="370" y="382" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">data-tn-state-*</text>
</g>

<line x1="228" y1="200" x2="286" y2="200" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="228" y1="308" x2="286" y2="308" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="236" y="190" font-family="sans-serif" font-size="12" fill="#5F5E5A">问</text>
<text x="236" y="298" font-family="sans-serif" font-size="12" fill="#5F5E5A">问</text>

<g>
<rect x="528" y="76" width="112" height="364" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="584" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">换肤</text>
<text x="584" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">三条路</text>

<text x="544" y="156" font-family="sans-serif" font-size="12" font-weight="500" fill="#444441">A 只写 CSS</text>
<text x="544" y="174" font-family="sans-serif" font-size="12" fill="#888780">属性选择器</text>

<text x="544" y="210" font-family="sans-serif" font-size="12" font-weight="500" fill="#444441">B + 骨架 HTML</text>
<text x="544" y="228" font-family="sans-serif" font-size="12" fill="#888780">换布局</text>

<text x="544" y="264" font-family="sans-serif" font-size="12" font-weight="500" fill="#444441">C + 写 kit</text>
<text x="544" y="282" font-family="sans-serif" font-size="12" fill="#888780">改结构</text>

<text x="544" y="328" font-family="sans-serif" font-size="12" fill="#5F5E5A">三条路都不动</text>
<text x="544" y="348" font-family="sans-serif" font-size="12" fill="#5F5E5A">core / ui / shell</text>

<text x="544" y="384" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041">零类名实证</text>
<text x="544" y="402" font-family="sans-serif" font-size="12" fill="#0F6E56">src/showcase/</text>
</g>
</svg>
