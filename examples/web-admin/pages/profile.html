<div class="stack" data-page="profile" data-script="profile">
        <section class="card">
          <div class="card-bd profile-top">
            <span class="avatar profile-avatar" id="pf-avatar">A</span>
            <div class="profile-meta">
              <div class="profile-name"><span id="pf-name">admin</span>
                <span class="tag tag-blue">系统管理员</span>
              </div>
              <div class="tiny muted">Web Admin · Tenon 框架演示账号</div>
            </div>
            <div class="profile-ops">
              <button class="btn btn-default" data-act="edit">
                <i class="fa-regular fa-pen-to-square"></i>编辑资料
              </button>
              <button class="btn btn-danger" data-act="logout">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>退出登录
              </button>
            </div>
          </div>
        </section>

        <div class="grid2">
          <section class="card">
            <div class="card-hd"><span>基本信息</span></div>
            <div class="card-bd">
              <div class="desc-row"><span class="desc-label">用户名</span><span>admin</span></div>
              <div class="desc-row"><span class="desc-label">角色</span><span>超级管理员</span></div>
              <div class="desc-row"><span class="desc-label">所属部门</span><span>技术中心 / 平台组</span></div>
              <div class="desc-row"><span class="desc-label">邮箱</span><span id="pf-email">admin@example.com</span></div>
              <div class="desc-row"><span class="desc-label">本次登录</span><span id="pf-login">—</span></div>
              <div class="desc-row"><span class="desc-label">登录状态</span><span id="pf-state">本次会话有效</span></div>
            </div>
          </section>

          <section class="card">
            <div class="card-hd"><span>安全设置</span></div>
            <div class="card-bd">
              <div class="desc-row"><span class="desc-label">登录密码</span><span>已设置 · 上次修改 30 天前 <button class="btn btn-text btn-sm" data-act="pwd">修改</button></span></div>
              <div class="desc-row"><span class="desc-label">二次验证</span><span>未开启 <button class="btn btn-text btn-sm" data-act="mfa">去开启</button></span></div>
              <div class="desc-row"><span class="desc-label">登录设备</span><span>Chrome · Windows · 当前设备</span></div>
              <div class="desc-row"><span class="desc-label">主题配色</span><span>跟随本地设置 <button class="btn btn-text btn-sm" data-act="theme">去设置</button></span></div>
            </div>
          </section>
        </div>
      </div>
